name: Build Windows EXE

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: bmi2
            target: x86_64-pc-windows-msvc
            rustflags: "-C target-cpu=x86-64-v2 -C target-feature=+bmi2"
          - variant: avx2
            target: x86_64-pc-windows-msvc
            rustflags: "-C target-cpu=x86-64-v3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        shell: bash
        run: |
          set -e
          cargo build --release --target "${{ matrix.target }}" --verbose

          if [ ! -f "target/${{ matrix.target }}/release/reckless.exe" ]; then
            echo "Build failed: reckless.exe not found at target/${{ matrix.target }}/release"
            ls -la "target/${{ matrix.target }}/release" || echo "Release directory does not exist"
            exit 1
          fi
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Rename binary
        shell: bash
        run: |
          mv "target/${{ matrix.target }}/release/reckless.exe" "reckless-windows-${{ matrix.variant }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v5.0.0
        with:
          name: reckless-windows-${{ matrix.variant }}
          path: reckless-windows-${{ matrix.variant }}.exe
